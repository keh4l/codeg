name: Sync upstream

# Fork maintenance (keh4l/codeg only):
#   1. fast-forward `main` to xintaofei/codeg:main — the same as the
#      "Sync fork" button, so `main` never carries commits of its own;
#   2. open a PR bringing `main` into `keh4l`, the custom branch releases are
#      cut from. Merge it with a merge commit once its checks pass; when it
#      conflicts, merge `main` into `keh4l` locally and push.
#
# Set the SYNC_TOKEN secret to a fine-grained token for this repository
# (Contents, Pull requests and Workflows: read and write). Without it the
# built-in GITHUB_TOKEN is used, which cannot sync an upstream change to
# `.github/workflows/`, and whose PRs do not start the Test workflow.

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'keh4l/codeg'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      FORK_BRANCH: keh4l
    steps:
      - name: Fast-forward main to upstream
        run: |
          set -euo pipefail
          # Fast-forward only: a `main` that has diverged is refused (HTTP 409)
          # instead of rewritten, and the run fails so it gets noticed.
          gh api -X POST "repos/$REPO/merge-upstream" -f branch=main --jq '.message'

      - name: Open a PR bringing main into the custom branch
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/$REPO/compare/$FORK_BRANCH...main" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "$FORK_BRANCH already contains everything on main."
            exit 0
          fi
          existing=$(gh pr list -R "$REPO" --base "$FORK_BRANCH" --head main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open; it picks up the new commits by itself."
            exit 0
          fi
          gh pr create -R "$REPO" --base "$FORK_BRANCH" --head main \
            --title "Sync upstream into $FORK_BRANCH" \
            --body "Brings $ahead upstream commit(s) from \`main\` into \`$FORK_BRANCH\`.

          Merge with **Create a merge commit** once the checks pass. If GitHub reports conflicts, resolve them locally:

          \`\`\`bash
          git fetch origin
          git switch $FORK_BRANCH && git pull
          git merge origin/main   # resolve, run the tests
          git push                # this PR closes as merged
          \`\`\`"
